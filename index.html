<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>freegames.watch — monitor de jogos grátis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
  :root{
    --bg: #14161b;
    --bg-alt: #191c22;
    --surface: #1e222a;
    --surface-2: #242833;
    --border: #2b303c;
    --border-soft: #23272f;
    --text: #e4e7ec;
    --text-dim: #8b93a1;
    --text-faint: #5c6371;
    --blue: #4d8dfd;
    --blue-dim: #2f56a3;
    --green: #3ecf7e;
    --yellow: #e8b34c;
    --red: #ea6462;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --radius: 6px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(77,141,253,0.06), transparent 40%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
  ::selection{ background: var(--blue-dim); color: #fff; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: var(--bg); }
  ::-webkit-scrollbar-thumb{ background: var(--surface-2); border-radius: 10px; border: 2px solid var(--bg); }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---------- Titlebar ---------- */
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 10px 16px;
  }
  .titlebar .path{ font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
  .titlebar .clock{ font-family: var(--mono); font-size: 12px; color: var(--text-faint); }

  .frame{
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--bg-alt);
    padding: 26px 26px 10px;
  }

  header.hero{ margin-bottom: 22px; }
  .eyebrow{
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--blue); display:flex; align-items:center; gap:8px; margin-bottom: 10px;
  }
  .eyebrow .led{ width:7px; height:7px; border-radius:50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2.4s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.35; } }
  h1{
    font-family: var(--serif); font-weight: 500; font-size: 34px; letter-spacing: -0.01em;
    margin: 0 0 8px; color: #f2f4f7;
  }
  h1 .cursor{ display:inline-block; width:10px; height:28px; background: var(--blue); vertical-align: -4px; margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .sub{ color: var(--text-dim); font-size: 14.5px; max-width: 640px; line-height:1.55; }
  .sub code{ font-family: var(--mono); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; color: var(--yellow); font-size: 12.5px; }

  /* ---------- Stat strip ---------- */
  .stats{ display:grid; grid-template-columns: repeat(4,1fr); gap:1px; background: var(--border); border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; margin: 22px 0 24px; }
  .stat{ background: var(--surface); padding: 14px 16px; }
  .stat .n{ font-family: var(--mono); font-size: 22px; color: #fff; }
  .stat .l{ font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; margin-top:3px; }

  /* ---------- Controls ---------- */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom: 16px; }
  .search-box{
    display:flex; align-items:center; gap:8px; background: var(--surface);
    border:1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; flex: 1 1 240px;
    font-family: var(--mono); font-size: 13px;
  }
  .search-box span{ color: var(--text-faint); }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text); font-family: var(--mono); font-size:13px; width:100%;
  }
  .search-box input::placeholder{ color: var(--text-faint); }
  kbd{
    font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
    border: 1px solid var(--border-soft); border-bottom-width:2px; border-radius:4px; padding: 1px 5px;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family: var(--mono); font-size: 12px; padding: 7px 11px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px; transition: all .12s ease;
  }
  .chip .led{ width:6px; height:6px; border-radius:50%; background: currentColor; opacity:.5; }
  .chip.active{ background: var(--blue-dim); border-color: var(--blue); color:#dce8ff; }
  .chip.active .led{ opacity:1; box-shadow: 0 0 6px currentColor; }
  .chip:hover{ border-color: var(--blue); }

  .toggle-line{ display:flex; align-items:center; gap:14px; margin: 4px 0 20px; font-family: var(--mono); font-size:12px; color: var(--text-faint); flex-wrap:wrap; }
  .toggle-line label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .toggle-line input{ accent-color: var(--blue); }
  .refresh-btn{
    font-family: var(--mono); font-size: 12px; color: var(--blue); background:none; border:1px solid var(--blue-dim);
    padding: 5px 10px; border-radius: 5px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover{ background: rgba(77,141,253,.08); }
  .refresh-btn.spinning svg{ animation: spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- Table ---------- */
  .panel{ border: 1px solid var(--border); border-radius: var(--radius); overflow:hidden; margin-bottom: 26px; background: var(--surface); }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; padding: 11px 16px;
    background: var(--surface-2); border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.06em;
  }
  .panel-head .hint{ text-transform:none; color: var(--text-faint); font-size: 11px; letter-spacing:0; }

  table{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  thead th{
    text-align:left; font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); text-transform:uppercase;
    letter-spacing:.07em; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--bg-alt);
    position: sticky; top:0;
  }
  tbody tr{ border-bottom: 1px solid var(--border-soft); transition: background .1s ease; }
  tbody tr:hover{ background: rgba(255,255,255,0.015); }
  tbody tr:last-child{ border-bottom:none; }
  td{ padding: 11px 14px; vertical-align: middle; }
  td.proto{ font-family: var(--mono); font-size: 12px; white-space:nowrap; }
  .game-cell{ display:flex; align-items:center; gap:10px; min-width: 220px; }
  .game-cell img{ width: 34px; height:34px; border-radius:5px; object-fit:cover; background: var(--surface-2); flex-shrink:0; }
  .game-title{ color:#f0f2f5; font-weight:500; }
  .game-title a{ color: inherit; text-decoration:none; }
  .game-title a:hover{ color: var(--blue); text-decoration:underline; }
  .game-type{ font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  td.date-cell{ font-family: var(--mono); font-size: 12px; color: var(--text-dim); white-space:nowrap; }
  .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; }
  .status-dot.on{ background: var(--green); box-shadow:0 0 6px var(--green); }
  .status-dot.soon{ background: var(--yellow); box-shadow:0 0 6px var(--yellow); }
  .status-dot.perm{ background: var(--text-faint); }
  .status-dot.off{ background: var(--red); }
  .ttl{ font-family: var(--mono); font-size: 12.5px; }
  .ttl.soon{ color: var(--yellow); }
  .ttl.perm{ color: var(--text-faint); }
  .ttl.off{ color: var(--red); }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    background:none; border: 1px solid var(--border); color: var(--text-faint); width:26px; height:26px;
    border-radius:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .icon-btn:hover{ border-color: var(--red); color: var(--red); }
  .icon-btn.edit:hover{ border-color: var(--blue); color: var(--blue); }

  .empty-row td{ padding: 30px 14px; text-align:center; color: var(--text-faint); font-family: var(--mono); font-size:12.5px; }
  .error-banner{
    margin: 0 0 16px; padding: 12px 14px; border: 1px solid #4a2e2e; background: rgba(234,100,98,0.08);
    border-radius: var(--radius); font-family: var(--mono); font-size:12.5px; color: #f4a6a4; line-height:1.5;
  }

  footer{ text-align:center; font-family: var(--mono); font-size: 11px; color: var(--text-faint); padding: 24px 0 6px; }
  footer a{ color: var(--text-faint); }

  @media (max-width: 760px){
    .stats{ grid-template-columns: repeat(2,1fr); }
    thead th:nth-child(4), td.date-cell.since{ display:none; }
    .frame{ padding: 18px 14px 6px; }
    h1{ font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="titlebar">
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="path">~/freegames.watch</span>
    </div>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="frame">
    <header class="hero">
      <div class="eyebrow"><span class="led"></span> live giveaway monitor</div>
      <h1>freegames<span style="color:var(--text-faint)">.</span>watch<span class="cursor"></span></h1>
    </header>

    <div class="stats">
      <div class="stat"><div class="n" id="statActive">–</div><div class="l">ativos agora</div></div>
      <div class="stat"><div class="n" id="statSoon">–</div><div class="l">saem em ≤3 dias</div></div>
      <div class="stat"><div class="n" id="statPerm">–</div><div class="l">permanentes</div></div>
      <div class="stat"><div class="n" id="statUpdated">–</div><div class="l">última sync</div></div>
    </div>

    <div id="errorBanner"></div>

    <div class="controls">
      <div class="search-box">
        <span>grep</span>
        <input type="text" id="search" placeholder="filtrar por nome do jogo…">
        <kbd>/</kbd>
      </div>
      <button class="refresh-btn" id="refreshBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v6h-6"/></svg>
        sync
      </button>
    </div>

    <div class="chips" id="chips"></div>

    <!-- LIVE PANEL -->
    <div class="panel">
      <div class="panel-head">
        <span id="liveTitle">connections</span>
        <span class="hint" id="liveCount"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:14%">proto</th>
            <th>jogo</th>
            <th style="width:15%">status</th>
            <th style="width:14%" class="since-col">since</th>
            <th style="width:12%">ttl</th>
          </tr>
        </thead>
        <tbody id="liveBody">
          <tr class="empty-row"><td colspan="5">conectando ao gamerpower.com …</td></tr>
        </tbody>
      </table>
    </div>

    <footer>Personal project. No support or bug fixes provided.</footer>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PLATFORMS = [
    { key:"steam",  api:"steam",              label:"steam",  color:"#66c0f4" },
    { key:"epic",   api:"epic-games-store",   label:"epic",   color:"#bdbdbd" },
    { key:"gog",    api:"gog",                label:"gog",    color:"#a06fdb" },
    { key:"ps4",    api:"ps4",                label:"ps4",    color:"#4d8dfd" },
    { key:"ps5",    api:"ps5",                label:"ps5",    color:"#4d8dfd" },
    { key:"itchio", api:"itchio",             label:"itch",   color:"#fa5c5c" }
  ];
  var CACHE_KEY = "fgw_cache_v1";
  var CACHE_TTL_MS = 15 * 60 * 1000;

  var state = {
    live: [],
    activePlatforms: PLATFORMS.map(function(p){ return p.key; }),
    search: "",
    lastSync: null
  };

  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function fmtDate(d){
    if(!d) return "—";
    return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
  }
  function parseDate(str){
    if(!str) return null;
    var s = String(str).trim();
    if(!s || s.toUpperCase() === "N/A") return null;
    var d = new Date(s.length <= 10 ? s + "T00:00:00" : s);
    if(isNaN(d.getTime())) return null;
    return d;
  }
  function daysBetween(a, b){
    var MS = 24*60*60*1000;
    return Math.round((b.setHours(0,0,0,0) - a.setHours(0,0,0,0)) / MS);
  }
  function ttlInfo(endDate){
    if(!endDate) return { label:"sem prazo", cls:"perm", days:Infinity };
    var today = new Date();
    var days = daysBetween(new Date(today), new Date(endDate));
    if(days < 0) return { label:"expirado", cls:"off", days: days };
    if(days === 0) return { label:"expira hoje", cls:"soon", days: 0 };
    if(days <= 3) return { label: days + "d restantes", cls:"soon", days: days };
    return { label: days + "d restantes", cls:"on", days: days };
  }
  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function normalize(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

  // ---------- clock ----------
  function tickClock(){
    var d = new Date();
    $("clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  }
  setInterval(tickClock, 1000); tickClock();

  // ---------- chips ----------
  function renderChips(){
    var wrap = $("chips");
    wrap.innerHTML = "";
    PLATFORMS.forEach(function(p){
      var active = state.activePlatforms.indexOf(p.key) > -1;
      var chip = document.createElement("div");
      chip.className = "chip" + (active ? " active" : "");
      chip.style.color = active ? "" : "";
      chip.innerHTML = '<span class="led" style="color:'+p.color+'"></span>' + p.label + "://";
      chip.addEventListener("click", function(){
        var idx = state.activePlatforms.indexOf(p.key);
        if(idx > -1) state.activePlatforms.splice(idx,1);
        else state.activePlatforms.push(p.key);
        renderChips();
        renderLive();
      });
      wrap.appendChild(chip);
    });
  }

  // ---------- fetch live data ----------
  function fetchPlatform(p){
    var url = "https://www.gamerpower.com/api/giveaways?platform=" + encodeURIComponent(p.api) + "&type=game";
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(data){
      if(!Array.isArray(data)) return [];
      return data.map(function(g){
        return {
          id: g.id,
          title: g.title || "sem título",
          image: g.thumbnail || g.image || "",
          url: g.open_giveaway_url || g.gamerpower_url || "#",
          entered: parseDate(g.published_date),
          expires: parseDate(g.end_date),
          platformKey: p.key,
          platformLabel: p.label
        };
      });
    }).catch(function(err){
      console.warn("falhou " + p.key, err);
      return { __error: p.key };
    });
  }

  function loadLive(useCache){
    if(useCache){
      try{
        var raw = localStorage.getItem(CACHE_KEY);
        if(raw){
          var cached = JSON.parse(raw);
          if(cached.ts && (Date.now() - cached.ts) < CACHE_TTL_MS){
            state.live = cached.games.map(function(g){
              g.entered = g.entered ? new Date(g.entered) : null;
              g.expires = g.expires ? new Date(g.expires) : null;
              return g;
            });
            state.lastSync = new Date(cached.ts);
            renderLive();
            renderStats();
            return Promise.resolve();
          }
        }
      }catch(e){}
    }
    return doSync();
  }

  function doSync(){
    var btn = $("refreshBtn");
    btn.classList.add("spinning");
    $("errorBanner").innerHTML = "";
    return Promise.all(PLATFORMS.map(fetchPlatform)).then(function(results){
      var games = [];
      var failed = [];
      var seen = {};
      results.forEach(function(r, i){
        if(r && r.__error){ failed.push(PLATFORMS[i].label); return; }
        (r||[]).forEach(function(g){
          var key = g.platformKey + ":" + g.id;
          if(!seen[key]){ seen[key] = true; games.push(g); }
        });
      });
      state.live = games;
      state.lastSync = new Date();
      try{
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          ts: state.lastSync.getTime(),
          games: games.map(function(g){
            return {
              id:g.id, title:g.title, image:g.image, url:g.url,
              entered: g.entered ? g.entered.toISOString() : null,
              expires: g.expires ? g.expires.toISOString() : null,
              platformKey:g.platformKey, platformLabel:g.platformLabel
            };
          })
        }));
      }catch(e){}
      if(failed.length){
        $("errorBanner").innerHTML =
          '<div class="error-banner">⚠ não consegui sincronizar: ' + failed.join(", ") +
          ". o resto carregou normal — tenta o sync de novo em alguns minutos.</div>";
      }
      renderLive();
      renderStats();
    }).catch(function(err){
      $("errorBanner").innerHTML =
        '<div class="error-banner">⚠ falha total ao conectar no gamerpower.com. verifique sua internet e clique em sync.<br>' +
        escapeHtml(err.message) + "</div>";
    }).finally(function(){
      btn.classList.remove("spinning");
    });
  }

  // ---------- render live table ----------
  function renderLive(){
    var body = $("liveBody");
    var q = normalize(state.search);
    var rows = state.live.filter(function(g){
      if(state.activePlatforms.indexOf(g.platformKey) === -1) return false;
      var t = ttlInfo(g.expires);
      if(t.cls === "off") return false;
      if(q && normalize(g.title).indexOf(q) === -1) return false;
      return true;
    });
    rows.sort(function(a,b){
      var ta = ttlInfo(a.expires).days, tb = ttlInfo(b.expires).days;
      return ta - tb;
    });
    $("liveCount").textContent = rows.length + " conexões";
    if(!rows.length){
      body.innerHTML = '<tr class="empty-row"><td colspan="5">nenhum resultado — ajuste os filtros ou o termo de busca.</td></tr>';
      return;
    }
    body.innerHTML = rows.map(function(g){
      var t = ttlInfo(g.expires);
      var dotCls = t.cls === "off" ? "off" : (t.cls === "soon" ? "soon" : (t.cls === "perm" ? "perm" : "on"));
      return '<tr>' +
        '<td class="proto" style="color:' + platColor(g.platformKey) + '">' + g.platformLabel + '://</td>' +
        '<td><div class="game-cell">' +
          (g.image ? '<img src="'+escapeHtml(g.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
          '<div class="game-title"><a href="'+escapeHtml(g.url)+'" target="_blank" rel="noopener">'+escapeHtml(g.title)+'</a></div>' +
        '</div></td>' +
        '<td><span class="status-dot '+dotCls+'"></span>'+ (t.cls==="off" ? "expirado" : t.cls==="perm" ? "ativo" : "ativo") +'</td>' +
        '<td class="date-cell since">' + (g.entered ? fmtDate(g.entered) : "—") + '</td>' +
        '<td class="ttl ' + t.cls + '">' + t.label + '</td>' +
      '</tr>';
    }).join("");
  }

  function platColor(key){
    var p = PLATFORMS.filter(function(x){ return x.key === key; })[0];
    return p ? p.color : "#ff9900";
  }

  function renderStats(){
    var actives = state.live.filter(function(g){ return ttlInfo(g.expires).cls !== "off"; });
    var soon = state.live.filter(function(g){ return ttlInfo(g.expires).cls === "soon"; });
    var perm = state.live.filter(function(g){ return ttlInfo(g.expires).cls === "perm"; });
    $("statActive").textContent = actives.length;
    $("statSoon").textContent = soon.length;
    $("statPerm").textContent = perm.length;
    $("statUpdated").textContent = state.lastSync ? (pad(state.lastSync.getHours())+":"+pad(state.lastSync.getMinutes())) : "–";
  }

  // ---------- events ----------
  $("refreshBtn").addEventListener("click", function(){ doSync(); });
  $("search").addEventListener("input", function(e){
    state.search = e.target.value;
    renderLive();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "/" && document.activeElement !== $("search") && document.activeElement.tagName !== "INPUT"){
      e.preventDefault();
      $("search").focus();
    }
  });

  // ---------- init ----------
  renderChips();
  loadLive(true);
  setInterval(function(){ doSync(); }, 30 * 60 * 1000);

})();
</script>
</body>
</html>
